let selected = -1;


function startQuiz(){

playerName = document.getElementById("name").value.trim();

if(playerName === ""){
alert("कृपया अपना नाम लिखें।");
return;
}

document.getElementById("startScreen").classList.add("hidden");
document.getElementById("quizScreen").classList.remove("hidden");

showQuestion();
}


function showQuestion(){

selected = -1;

let q = questions[current];

document.getElementById("questionNumber").innerText =
"Question " + (current + 41) + " / 80";

document.getElementById("question").innerText = q.q;

let html = "";

q.o.forEach((option,index)=>{

html += `
<button class="option"
onclick="selectOption(${index})">
${String.fromCharCode(65+index)}. ${option}
</button>
`;

});

document.getElementById("options").innerHTML = html;

}


function selectOption(index){

selected = index;

let buttons = document.querySelectorAll(".option");

buttons.forEach((btn,i)=>{

btn.style.background = "";

if(i === index){
btn.style.background = "#bfdbfe";
}

});

}


function nextQuestion(){

if(selected === -1){
alert("कृपया एक option select करें।");
return;
}

if(selected === questions[current].a){
score++;
}

current++;

if(current < questions.length){

showQuestion();

}else{

showResult();

}

}


function showResult(){

document.getElementById("quizScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.remove("hidden");

document.getElementById("resultName").innerText =
playerName;

document.getElementById("score").innerText =
score;

document.getElementById("correctWrong").innerText =
"सही उत्तर: " + score +
" | गलत उत्तर: " + (40-score);

}

</script>

</body>
</html>
